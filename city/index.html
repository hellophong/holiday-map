<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The 16th Annual Holiday Guide — City Edition</title>
  <meta name="description" content="Map of Richmond, VA Christmas shops, bakeries, tree farms and makers." />

  <!-- Set before any CSS paints, so the page never flashes light-then-dark
       (or vice versa) on load. Only ever writes an *explicit* choice — a
       visitor who hasn't touched the toggle gets prefers-color-scheme via
       CSS alone, with nothing here to fight it. -->
  <script>
    (function () {
      var saved = localStorage.getItem("cityTheme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>

  <!-- A second look-and-feel for the same guide, living alongside the original at
       /holiday-map/ rather than replacing it — see /city/README.md. Leaflet, the
       typefaces, the map logic and the business data are all shared from the
       parent folder; only this stylesheet and the header artwork diverge. -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='13' r='9' fill='%23a6221a'/><rect x='15' y='20' width='2' height='9' fill='%231e2f45'/></svg>" />
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <header class="banner">
    <div class="banner__inner">
      <div class="toggle-group">
        <!-- Icon-only on every breakpoint on purpose — unlike the theme
             toggle, this never carries a text label at any width. -->
        <button type="button" id="musicToggle" class="music-toggle" aria-pressed="false" aria-label="Play background music">
          <svg class="music-toggle__icon music-toggle__icon--note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
          <svg class="music-toggle__icon music-toggle__icon--muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
            <line x1="3" y1="3" x2="21" y2="21" />
          </svg>
        </button>

        <button type="button" id="themeToggle" class="theme-toggle">
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="4.2" fill="currentColor" />
            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M10 1.6v2.3M10 16.1v2.3M18.4 10h-2.3M3.9 10H1.6" />
              <path d="M15.6 4.4l-1.6 1.6M6 14l-1.6 1.6M15.6 15.6L14 14M6 6L4.4 4.4" />
            </g>
          </svg>
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M17.3 12.3A7.3 7.3 0 0 1 7.7 2.7a7.3 7.3 0 1 0 9.6 9.6z" fill="currentColor" />
          </svg>
          <span class="theme-toggle__label"></span>
        </button>
      </div>

      <audio id="bgMusic" src="assets/jingle-bells-slow-piano-loop.ogg" loop preload="none"></audio>

      <h1 class="banner__title" id="siteTitle">
        <span class="banner__lead" id="siteTitleLead">The 16th Annual</span>
        <span class="banner__main" id="siteTitleMain">Holiday Guide</span>
      </h1>
      <p class="banner__subtitle" id="siteSubtitle">Shop Local For Gifts And More</p>
    </div>

    <!-- Art-directed, not just resized: the mobile crop is a differently
         composed version of the same street (see /city/README.md), so this
         needs <picture>'s source-per-breakpoint rather than one <img> at a
         single fixed aspect ratio. -->
    <picture class="banner__scene">
      <source media="(max-width: 860px)" srcset="assets/holiday-header2-mobile.svg" />
      <img src="assets/holiday-header2.svg" alt="" aria-hidden="true" width="2000" height="300" />
    </picture>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="Directory">
      <div class="sidebar__head">
        <label class="search" for="search">
          <svg class="search__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="2" />
            <path d="M11 11l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="Search the directory…" autocomplete="off" />
        </label>
        <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      </div>
      <ul class="cards" id="cards"></ul>
      <p class="sidebar__note" id="sidebarNote"></p>
    </aside>

    <div class="map-frame">
      <div id="map" role="application" aria-label="Map of Christmas businesses"></div>
      <noscript><p class="noscript">This map needs JavaScript to unwrap itself.</p></noscript>
    </div>

    <!-- Mobile only: the on-map legend corner is hidden below 860px (it was
         covering a chunk of a small map), and this runs the same key
         underneath instead, wrapping to as many lines as it needs. Desktop
         keeps the on-map legend. -->
    <div class="legend-strip" id="legendStrip" role="list" aria-label="Category legend"></div>
  </main>

  <button type="button" id="backToTop" class="back-to-top">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 12.5V3.5M8 3.5L3.5 8M8 3.5L12.5 8" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Back to list
  </button>

  <script src="../vendor/leaflet/leaflet.js"></script>
  <script>
    // Point the shared app.js at the parent folder's data, rather than forking
    // a second copy of the same eleven businesses that would drift out of sync.
    window.DATA_URL = "../data/businesses.json";
    // Opts app.js into reading data-theme / prefers-color-scheme for which
    // basemap style to load (Alidade Smooth vs. its Dark counterpart) — see
    // the THEME_AWARE comment in js/app.js. The root page never sets this,
    // so its map is never at the mercy of a visitor's OS colour scheme
    // when its own chrome has no dark palette to match.
    window.THEME_AWARE = true;
  </script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById("themeToggle");
      var label = toggle.querySelector(".theme-toggle__label");
      var root = document.documentElement;
      var media = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");

      function effectiveTheme() {
        var explicit = root.getAttribute("data-theme");
        if (explicit === "light" || explicit === "dark") return explicit;
        return media && media.matches ? "dark" : "light";
      }

      function sync() {
        var isDark = effectiveTheme() === "dark";
        toggle.setAttribute("aria-pressed", String(isDark));
        toggle.setAttribute("aria-label", isDark ? "Switch to day mode" : "Switch to night mode");
        label.textContent = isDark ? "Day mode" : "Night mode";
      }

      // app.js defines this once its map exists — guarded here too since
      // this script can in principle run before that (script order makes
      // it very unlikely, but costs nothing to check).
      function refreshTiles() {
        if (window.refreshMapTileStyle) window.refreshMapTileStyle();
      }

      toggle.addEventListener("click", function () {
        var next = effectiveTheme() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("cityTheme", next); } catch (err) { /* private mode, etc. — toggle still works this load */ }
        sync();
        refreshTiles();
      });

      // Only follow a live OS theme change while the visitor hasn't picked
      // a side themselves — an explicit choice should stick regardless of
      // what the system does around it.
      if (media && media.addEventListener) {
        media.addEventListener("change", function () {
          if (!root.getAttribute("data-theme")) {
            sync();
            refreshTiles();
          }
        });
      }

      sync();
    })();

    (function () {
      var toggle = document.getElementById("musicToggle");
      var audio = document.getElementById("bgMusic");

      function sync(playing) {
        toggle.setAttribute("aria-pressed", String(playing));
        toggle.setAttribute("aria-label", playing ? "Mute background music" : "Play background music");
      }

      toggle.addEventListener("click", function () {
        if (audio.paused) {
          // play() returns a promise that rejects if the browser blocks it;
          // only flip the icon once playback actually starts, so a block
          // doesn't leave the button lying about what's playing.
          var result = audio.play();
          if (result && result.then) {
            result.then(function () { sync(true); }).catch(function () { sync(false); });
          } else {
            sync(true);
          }
        } else {
          audio.pause();
          sync(false);
        }
      });

      // Covers a pause/stop triggered some other way (e.g. browser media
      // controls), so the icon never drifts from the audio element's own
      // state.
      audio.addEventListener("pause", function () { sync(false); });
      audio.addEventListener("play", function () { sync(true); });
    })();
  </script>
</body>
</html>
